# ============================================================
# CyberAI-Expert v8.0 — Docker Compose (Ubuntu Server 22.04)
# 25+ Services: Full SOC AI Platform
# ============================================================


x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  cyberai-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${CYBERAI_SUBNET:-172.28.0.0/16}

volumes:
  cockroachdb-data:
  elasticsearch-data:
  influxdb-data:
  grafana-data:
  minio-data:
  redis-data:
  superset-data:
  mlflow-data:
  zeek-logs:
  suricata-logs:

services:

  # ==================== INFRASTRUCTURE ====================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: cyberai-zookeeper
    <<: *common
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [cyberai-net]
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M, cpus: '0.5' }

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: cyberai-kafka
    <<: *common
    depends_on:
      zookeeper: { condition: service_healthy }
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    ports: ["${KAFKA_PORT:-9092}:9092", "29092:29092"]
    networks: [cyberai-net]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 2G, cpus: '1.0' }

  kafka-init:
    image: confluentinc/cp-kafka:7.5.3
    container_name: cyberai-kafka-init
    depends_on:
      kafka: { condition: service_healthy }
    networks: [cyberai-net]
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo '=== Creating Kafka topics ==='
      topics='zeek-events suricata-alerts ml-predictions bigdata-processed soc-actions threat-intel dataset-updates'
      for t in $$topics; do
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic $$t
      done
      kafka-topics --list --bootstrap-server kafka:29092
      echo '=== Topics created ==='
      "
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: cyberai-kafka-ui
    <<: *common
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: cyberai-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports: ["${KAFKA_UI_PORT:-8090}:8080"]
    networks: [cyberai-net]
    deploy:
      resources:
        limits: { memory: 512M }

  # ==================== DATA STORES ====================

  cockroachdb:
    image: cockroachdb/cockroach:v24.1.0
    container_name: cyberai-cockroachdb
    <<: *common
    command: start-single-node --insecure --advertise-addr cockroachdb --listen-addr 0.0.0.0:26257 --http-addr 0.0.0.0:8080 --store=attrs=ssd,path=/var/lib/cockroachdb
    environment:
      COCKROACH_USER: ${COCKROACH_USER:-cyberai}
      COCKROACH_PASSWORD: ${COCKROACH_PASSWORD:-CyberAI_S3cur3_2024!}
      COCKROACH_DATABASE: ${COCKROACH_DATABASE:-cyberai_soc}
    ports: ["${COCKROACH_PORT:-26257}:26257", "${COCKROACH_UI_PORT:-8080}:8080"]
    volumes:
      - cockroachdb-data:/var/lib/cockroachdb
      - ./scripts/init_cockroach.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [cyberai-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 2G, cpus: '1.5' }

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: cyberai-elasticsearch
    <<: *common
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
      cluster.name: cyberai-cluster
    ports: ["${ES_PORT:-9200}:9200"]
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    networks: [cyberai-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 2G, cpus: '1.0' }

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: cyberai-kibana
    <<: *common
    depends_on:
      elasticsearch: { condition: service_healthy }
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports: ["5601:5601"]
    networks: [cyberai-net]
    deploy:
      resources:
        limits: { memory: 1G }

  influxdb:
    image: influxdb:2.7-alpine
    container_name: cyberai-influxdb
    <<: *common
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
    ports: ["${INFLUXDB_PORT:-8086}:8086"]
    volumes: [influxdb-data:/var/lib/influxdb2]
    networks: [cyberai-net]
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cyberai-redis
    <<: *common
    command: redis-server --requirepass ${REDIS_PASSWORD:-Redis_CyberAI_2024!} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    networks: [cyberai-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Redis_CyberAI_2024!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cyberai-minio
    <<: *common
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio-data:/data]
    networks: [cyberai-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: cyberai-minio-init
    depends_on:
      minio: { condition: service_healthy }
    networks: [cyberai-net]
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      mc alias set cyberai http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
      for bucket in mlflow-artifacts datasets models reports zeek-logs suricata-logs; do
        mc mb --ignore-existing cyberai/$$bucket
      done
      mc ls cyberai
      "
    restart: "no"

  # ==================== SECURITY SENSORS ====================

  zeek:
    image: zeek/zeek:latest
    container_name: cyberai-zeek
    <<: *common
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - zeek-logs:/opt/zeek/logs
      - ./config/zeek/local.zeek:/opt/zeek/share/zeek/site/local.zeek:ro
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Waiting for network interface...'
      sleep 10
      if ip link show ${ZEEK_CAPTURE_INTERFACE:-eth1} > /dev/null 2>&1; then
        zeek -i ${ZEEK_CAPTURE_INTERFACE:-eth1} /opt/zeek/share/zeek/site/local.zeek
      else
        echo 'Interface ${ZEEK_CAPTURE_INTERFACE:-eth1} not found, running in offline mode'
        echo 'Configure GNS3_MIRROR_INTERFACE in .env to match your GNS3 mirror port'
        tail -f /dev/null
      fi
      "
    profiles: ["sensors"]

  suricata:
    image: jasonish/suricata:latest
    container_name: cyberai-suricata
    <<: *common
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    volumes:
      - suricata-logs:/var/log/suricata
      - ./config/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
    command: -i ${SURICATA_CAPTURE_INTERFACE:-eth1} --set outputs.0.eve-log.filetype=regular
    profiles: ["sensors"]

  # ==================== LOG INGESTORS ====================

  log-ingestor:
    build:
      context: ./engine
      dockerfile: Dockerfile.ingestor
    container_name: cyberai-log-ingestor
    <<: *common
    depends_on:
      kafka: { condition: service_healthy }
      cockroachdb: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    environment:
      KAFKA_BROKER: kafka:29092
      DATABASE_URL: postgresql://${COCKROACH_USER:-cyberai}:${COCKROACH_PASSWORD:-CyberAI_S3cur3_2024!}@cockroachdb:26257/${COCKROACH_DATABASE:-cyberai_soc}?sslmode=disable
      ELASTICSEARCH_URL: http://elasticsearch:9200
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      ZEEK_LOG_DIR: /zeek-logs
      SURICATA_LOG_DIR: /suricata-logs
      MODE: ${INGESTOR_MODE:-hybrid}
    volumes:
      - zeek-logs:/zeek-logs:ro
      - suricata-logs:/suricata-logs:ro
      - ./engine:/app/engine:ro
    networks: [cyberai-net]

  # ==================== MONITORING ====================

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: cyberai-prometheus
    <<: *common
    volumes: [./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    networks: [cyberai-net]

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: cyberai-node-exporter
    <<: *common
    ports: ["9100:9100"]
    networks: [cyberai-net]

  grafana:
    image: grafana/grafana:10.2.0
    container_name: cyberai-grafana
    <<: *common
    depends_on:
      cockroachdb: { condition: service_healthy }
      prometheus: { condition: service_started }
      mlflow: { condition: service_started }
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-worldmap-panel,grafana-piechart-panel,grafana-simple-json-datasource
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: http://localhost:3000/
    ports: ["${GF_PORT:-3000}:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [cyberai-net]

  # ==================== ML & AI ====================

  mlflow:
    image: python:3.11-slim
    container_name: cyberai-mlflow
    <<: *common
    depends_on:
      cockroachdb: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "pip install --quiet mlflow==2.9.2 psycopg2-binary boto3 &&
      mlflow server --backend-store-uri ${MLFLOW_BACKEND_STORE} \
        --default-artifact-root s3://mlflow-artifacts \
        --host 0.0.0.0 --port 5050"
    ports: ["${MLFLOW_PORT:-5050}:5050"]
    networks: [cyberai-net]

  # ==================== BACKEND ====================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberai-backend
    <<: *common
    depends_on:
      cockroachdb: { condition: service_healthy }
      kafka: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://${COCKROACH_USER:-cyberai}:${COCKROACH_PASSWORD:-CyberAI_S3cur3_2024!}@cockroachdb:26257/${COCKROACH_DATABASE:-cyberai_soc}?sslmode=disable
      DATABASE_URL_SYNC: postgresql://${COCKROACH_USER:-cyberai}:${COCKROACH_PASSWORD:-CyberAI_S3cur3_2024!}@cockroachdb:26257/${COCKROACH_DATABASE:-cyberai_soc}?sslmode=disable
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BROKER: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5050
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
      API_KEY_ADMIN: ${API_KEY_ADMIN}
      API_KEY_ANALYST: ${API_KEY_ANALYST}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports: ["${BACKEND_PORT:-8000}:8000"]
    volumes:
      - ./engine:/app/engine:ro
      - ./datasets:/app/datasets
    networks: [cyberai-net]

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberai-celery-worker
    <<: *common
    depends_on:
      redis: { condition: service_healthy }
      cockroachdb: { condition: service_healthy }
    command: celery -A app.tasks.celery_app worker -l info -c 4 -Q default,ml,bigdata
    environment:
      DATABASE_URL_SYNC: postgresql://${COCKROACH_USER:-cyberai}:${COCKROACH_PASSWORD:-CyberAI_S3cur3_2024!}@cockroachdb:26257/${COCKROACH_DATABASE:-cyberai_soc}?sslmode=disable
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      MLFLOW_TRACKING_URI: http://mlflow:5050
    volumes:
      - ./engine:/app/engine:ro
      - ./datasets:/app/datasets
    networks: [cyberai-net]

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberai-celery-beat
    <<: *common
    depends_on:
      redis: { condition: service_healthy }
    command: celery -A app.tasks.celery_app beat -l info
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    networks: [cyberai-net]

  # ==================== FRONTEND ====================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberai-frontend
    <<: *common
    ports: ["${FRONTEND_PORT:-3001}:3000"]
    networks: [cyberai-net]

  # ==================== REVERSE PROXY ====================

  nginx:
    image: nginx:1.25-alpine
    container_name: cyberai-nginx
    <<: *common
    depends_on: [backend, frontend]
    ports: ["${NGINX_PORT:-80}:80"]
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [cyberai-net]

  # ==================== VISUALIZATION ====================

  superset:
    image: apache/superset:3.0.1
    container_name: cyberai-superset
    <<: *common
    depends_on:
      cockroachdb: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
    ports: ["${SUPERSET_PORT:-8088}:8088"]
    volumes: [superset-data:/app/superset_home]
    networks: [cyberai-net]

  superset-init:
    image: apache/superset:3.0.1
    container_name: cyberai-superset-init
    depends_on: [superset]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      sleep 30 &&
      superset db upgrade &&
      superset fab create-admin --username ${SUPERSET_ADMIN_USER:-admin} \
        --firstname CyberAI --lastname Admin --email admin@cyberai.local \
        --password ${SUPERSET_ADMIN_PASSWORD:-admin} || true &&
      superset init
      "
    networks: [cyberai-net]
    restart: "no"
