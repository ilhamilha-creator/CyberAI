apiVersion: 1

datasources:
  - name: CyberAI-Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "5s"
      queryTimeout: "60s"
      httpMethod: "POST"
    secureJsonData: {}

  - name: CyberAI-MLflow
    type: prometheus
    access: proxy
    url: http://localhost:5000
    editable: true
    jsonData:
      timeInterval: "10s"
      queryTimeout: "30s"
    secureJsonData: {}
